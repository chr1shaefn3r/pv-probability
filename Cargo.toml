[workspace]
members = [".", "crates/ha-testdb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains in edition 2024 need 1.88.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/chr1shaefn3r/pv-probability"

# One version and one feature set per dependency for every crate, so building a single
# tool with `-p` resolves the same features as building the workspace and never forces
# a rebuild of the shared dependencies.
[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
rusqlite = { version = "0.40", features = ["bundled"] }

ha-testdb = { path = "crates/ha-testdb" }

[package]
name = "pv-probability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Turn a Home Assistant recorder database into per-month/week solar power likelihood flame graphs"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["solar", "photovoltaic", "home-assistant", "statistics", "visualization"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "pv-probability"
path = "src/main.rs"

[[bin]]
name = "energy-storage-payback-period"
path = "src/bin/energy-storage-payback-period.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
rayon.workspace = true
rusqlite.workspace = true

[dev-dependencies]
ha-testdb.workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
