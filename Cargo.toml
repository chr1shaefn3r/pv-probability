# One crate per tool under tools/, sharing the crates under crates/. A tool's crate is
# the only thing rebuilt when its own code changes; see the README's "Development".
[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains in edition 2024 need 1.88.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/chr1shaefn3r/pv-probability"

# One version and one feature set per dependency for every crate, so building a single
# tool with `-p` resolves the same features as building the workspace and never forces
# a rebuild of the shared dependencies.
[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
rusqlite = { version = "0.40", features = ["bundled"] }

ha-recorder = { path = "crates/ha-recorder" }
ha-report = { path = "crates/ha-report" }
ha-testdb = { path = "crates/ha-testdb" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
